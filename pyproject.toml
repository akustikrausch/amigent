[project]
name = "amigent"
dynamic = ["version"]
description = "Complete remote control for a real Amiga, by AI or manually"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andreas Wendorf (Akustikrausch)" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking",
]
dependencies = ["mcp>=1.2,<2", "pillow>=10"]

[project.scripts]
amigent-server = "amigent.server:main"
amigent-doctor = "amigent.doctor:main"
amigent-setup = "amigent.setup:main"
amigent-viewer = "amigent.viewer:main"
amigent-fleet = "amigent.fleet:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "amigent.__version__" }

[tool.setuptools.package-data]
amigent = ["web/*", "web/locales/*", "macos/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
