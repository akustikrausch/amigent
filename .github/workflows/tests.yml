# every push gets the full ride: three systems, oldest and newest Python
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: openssl on this runner
        run: openssl version
      - name: test
        run: python -m pytest -q -rs

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: build and check
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python -m pip install dist/*.whl
          cd / && python -c "import amigent.setup as s; assert (s.AMIGA / 'bin' / 'amigentd').exists()"
